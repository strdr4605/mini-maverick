services:
  openclaw-workspace-init:
    image: ghcr.io/openclaw/openclaw:latest
    user: root
    volumes:
      - openclaw-workspace:/home/node/.openclaw/workspace
    command: ["chown", "-R", "node:node", "/home/node/.openclaw/workspace"]
    restart: "no"

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    environment:
      HOME: /home/node
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
    volumes:
      - ./openclaw:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    depends_on:
      openclaw-workspace-init:
        condition: service_completed_successfully
    ports:
      - "18789:18789"
      - "3001:3001"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "openclaw.mjs",
        "gateway",
        "--bind", "lan",
        "--port", "18789",
        "--allow-unconfigured",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    network_mode: "service:openclaw"
    environment:
      OPENCLAW_WS_URL: ws://127.0.0.1:18789
      OPENCLAW_AUTH_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      openclaw:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openclaw-workspace:
